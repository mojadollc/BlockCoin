apps:
  - name: BlockCoin-web
    cwd: /opt/blockcoin/apps/web
    script: node_modules/.bin/next
    args: start -p 3005
    env_file: /opt/blockcoin/.env
    env:
      NODE_ENV: production

  - name: BlockCoin-api
    cwd: /opt/blockcoin/apps/api
    script: dist/index.js
    env_file: /opt/blockcoin/.env
    env:
      NODE_ENV: production

  - name: BlockCoin-worker
    cwd: /opt/blockcoin/apps/worker
    script: dist/index.js
    env_file: /opt/blockcoin/.env
    env:
      NODE_ENV: production
