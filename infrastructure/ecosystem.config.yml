apps:
  - name: BlockCoin-web
    cwd: apps/web
    script: node_modules/.bin/next
    args: start -p 3005
    env:
      NODE_ENV: production

  - name: BlockCoin-api
    cwd: apps/api
    script: dist/index.js
    env:
      NODE_ENV: production

  - name: BlockCoin-worker
    cwd: apps/worker
    script: dist/index.js
    env:
      NODE_ENV: production
