server {
    listen 80;
    server_name blockcoin.beegoo.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blockcoin.beegoo.app;

    ssl_certificate /etc/letsencrypt/live/blockcoin.beegoo.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blockcoin.beegoo.app/privkey.pem;

    # Frontend (Next.js on port 3005)
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API + WebSocket (Express on port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
